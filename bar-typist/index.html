<body>
<center>
  <h1>bar typist</h1>
  <p><small>type to study for the california bar exam.</small></p>

  <div id="test-section">
    <p id="passage-meta" style="font-size:0.82em;color:#666;margin-bottom:6px;text-align:left;"></p>
    <div id="passage-display"></div>
    <textarea id="type-input" rows="4"
      spellcheck="false"
      autocorrect="off"
      autocapitalize="off"
      autocomplete="off"
      placeholder="start typing to begin..."></textarea>
    <div id="live-stats">
      <span id="stat-wpm">0 wpm</span>
      <span id="stat-acc">100% acc</span>
      <span id="stat-time">0:00</span>
    </div>
    <div style="text-align:left;margin-bottom:8px;">
      <button class="btn-link" onclick="tryAgain()">try again</button>
      &nbsp;·&nbsp;
      <button class="btn-link" onclick="newPassage()">new passage</button>
    </div>
  </div>

    <div id="results-grid">

        <span class="result-label">wpm</span>
      </div>
      <div class="result-item">
        <span class="result-value" id="res-acc">—</span>
        <span class="result-label">accuracy</span>
